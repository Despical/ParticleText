plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'dev.despical'
version = '1.2.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public' }
    maven { url = 'https://repo.extendedclip.com/releases' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    compileOnly 'org.projectlombok:lombok:1.18.30'

    implementation('dev.despical:commons:2.0.6') {
        exclude group: 'org.slf4j'
    }
    implementation 'dev.despical:command-framework:1.5.9'
    implementation 'com.github.Despical:ParticleLib:1.0.7'

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.processResources {
    def props = [version: version]
    inputs.properties props

    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    minimize()

    relocate 'dev.despical.commons', 'dev.despical.particletext.lib.commons'
    relocate 'dev.despical.commandframework', 'dev.despical.particletext.lib.commandframework'
    relocate 'dev.despical.inventoryframework', 'dev.despical.particletext.lib.inventoryframework'
    relocate 'me.despical.particle', 'dev.despical.particletext.lib.particlelib'
    relocate 'org.bstats', 'dev.despical.particletext.lib.bstats'

    exclude 'META-INF/**'
    exclude 'fonts/**'

    archiveFileName = "particle-text-${version}.jar"
}
