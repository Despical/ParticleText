plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'dev.despical'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.112-stable'
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'org.projectlombok:lombok:1.18.46'

    implementation('dev.despical:commons:2.1.2') {
        exclude group: 'org.slf4j'
    }
    implementation 'dev.despical:command-framework:1.6.5'
    implementation 'dev.despical:inventory-framework:2.4.7'
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

tasks.processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'

    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.test {
    useJUnitPlatform()
}

tasks.jar {
    enabled = false
}

tasks.shadowJar {
    minimize()

    relocate 'dev.despical.commons', 'dev.despical.particletext.lib.commons'
    relocate 'dev.despical.commandframework', 'dev.despical.particletext.lib.commandframework'
    relocate 'dev.despical.inventoryframework', 'dev.despical.particletext.lib.inventoryframework'
    relocate 'org.bstats', 'dev.despical.particletext.lib.bstats'

    exclude 'META-INF/**'

    archiveFileName = "particle-text-${version}.jar"
}
