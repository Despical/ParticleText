# Messages use Adventure MiniMessage. Hex colors, gradients, hover and click
# events are supported. PlaceholderAPI placeholders are resolved for players.

prefix: '<gradient:#00E5FF:#7C4DFF><bold>Particle Text</bold></gradient> <#37474F>» '
plugin-info: '%prefix%<#BDBDBD>Running <#00E5FF>v%version% <#BDBDBD>by <click:open_url:"https://github.com/Despical"><hover:show_text:"<gray>Click to visit the Despical GitHub profile.</gray>"><#FFA726><u>Despical</u></hover></click><#BDBDBD>.'
unrecognized-arguments: '%prefix%<#FF5252>Unknown arguments. <#BDBDBD>Use <#FFCA28>/%label% help<#BDBDBD>.'
correct-usage: '%prefix%<#FF5252>Correct usage: <#FFCA28>%usage%'
player-only: '%prefix%<#FF5252>This command can only be used by a player.'
invalid-id: '%prefix%<#FF5252>IDs may only contain lowercase letters, numbers, underscores, and hyphens (max 32).'
renderer-exists: '%prefix%<#FF5252>A renderer named <#FFCA28>%id% <#FF5252>already exists.'
renderer-not-found: '%prefix%<#FF5252>No renderer named <#FFCA28>%id% <#FF5252>was found.'
renderer-created: '%prefix%<#00E676>Created <#FFCA28>%id% <#00E676>with the cached defaults.'
renderer-deleted: '%prefix%<#00E676>Deleted <#FFCA28>%id%<#00E676>.'
renderer-list: '%prefix%<#BDBDBD>Renderers (<#00E5FF>%count%<#BDBDBD>): <#FFCA28>%renderers%'
renderer-list-empty: '%prefix%<#BDBDBD>No renderers exist. Use <#FFCA28>/%label% create <id> <text><#BDBDBD>.'
renderer-teleported: '%prefix%<#00E676>Teleported to <#FFCA28>%id%<#00E676>.'
world-unavailable: '%prefix%<#FF5252>The world <#FFCA28>%world% <#FF5252>is not currently loaded.'
renderer-moved: '%prefix%<#00E676>Moved <#FFCA28>%id% <#00E676>to your location.'
renderer-shifted: '%prefix%<#00E676>Moved <#FFCA28>%id% <#29B6F6>%direction% <#00E676>by <#29B6F6>%amount% <#00E676>blocks and saved its new position.'
renderer-size: '%prefix%<#00E676>Set <#FFCA28>%id% <#00E676>scale to <#29B6F6>%size%<#00E676>.'
renderer-text: '%prefix%<#00E676>Updated the text for <#FFCA28>%id%<#00E676>.'
renderer-font: '%prefix%<#00E676>Set <#FFCA28>%id% <#00E676>font to <#29B6F6>%font% %style% %size%<#00E676>.'
renderer-particle: '%prefix%<#00E676>Set <#FFCA28>%id% <#00E676>particle to <#29B6F6>%particle%<#00E676>.'
renderer-enabled: '%prefix%<#00E676>Renderer <#FFCA28>%id% <#00E676>is now enabled and visible to nearby players.'
renderer-disabled: '%prefix%<#BDBDBD>Renderer <#FFCA28>%id% <#BDBDBD>is now disabled and hidden from all players.'
renderer-inverted: '%prefix%<#00E676>Set <#FFCA28>%id% <#00E676>inverted mode to <#29B6F6>%inverted%<#00E676>.'
renderer-rotated: '%prefix%<#00E676>Set <#FFCA28>%id% <#00E676>rotation on <#29B6F6>%axis% <#00E676>to <#29B6F6>%angle%°<#00E676>.'
invalid-number: '%prefix%<#FF5252>%value% <#BDBDBD>is not a valid number.'
invalid-size: '%prefix%<#FF5252>Scale must be greater than 0 and at most 10.'
text-too-long: '%prefix%<#FF5252>Renderer text may contain at most <#FFCA28>%max% <#FF5252>characters.'
invalid-font: '%prefix%<#FF5252>Font style must be <#FFCA28>PLAIN<#FF5252>, <#FFCA28>BOLD<#FF5252>, <#FFCA28>ITALIC<#FF5252>, or <#FFCA28>BOLD_ITALIC<#FF5252>; size must be 4-128.'
invalid-axis: '%prefix%<#FF5252>Axis must be <#FFCA28>x<#FF5252>, <#FFCA28>y<#FF5252>, or <#FFCA28>z<#FF5252>.'
invalid-direction: '%prefix%<#FF5252>Direction must be <#FFCA28>forward<#FF5252>, <#FFCA28>backward<#FF5252>, <#FFCA28>left<#FF5252>, <#FFCA28>right<#FF5252>, <#FFCA28>up<#FF5252>, or <#FFCA28>down<#FF5252>.'
invalid-move-amount: '%prefix%<#FF5252>Move amount must be between <#FFCA28>0.01 <#FF5252>and <#FFCA28>100 <#FF5252>blocks.'
invalid-particle: '%prefix%<#FF5252>%particle% <#BDBDBD>is not a data-free particle supported by Particle Text.'
reloaded: '%prefix%<#00E676>Reloaded settings, messages, renderer data, PlaceholderAPI text, menu values, and the render task.'

help:
  - '<#37474F><st>                                                                </st>'
  - '%center%<gradient:#00E5FF:#7C4DFF><bold>Particle Text Commands</bold></gradient>'
  - ''
  - '<#2F2F2F>• <#FFCA28>/%label% create <id> <text> <#37474F>- <#BDBDBD>Create a renderer with default configuration.'
  - '<#2F2F2F>• <#FFCA28>/%label% delete <id> <#37474F>- <#BDBDBD>Delete a renderer.'
  - '<#2F2F2F>• <#FFCA28>/%label% list <#37474F>- <#BDBDBD>List renderers.'
  - '<#2F2F2F>• <#FFCA28>/%label% menu <#37474F>- <#BDBDBD>Open the renderer menu.'
  - '<#2F2F2F>• <#FFCA28>/%label% teleport|tphere <id> <#37474F>- <#BDBDBD>Move yourself or the renderer.'
  - '<#2F2F2F>• <#FFCA28>/%label% move <id> <direction> [amount] <#37474F>- <#BDBDBD>Move a renderer relative to your facing direction.'
  - '<#2F2F2F>• <#FFCA28>/%label% text <id> <text> <#37474F>- <#BDBDBD>Change displayed text.'
  - '<#2F2F2F>• <#FFCA28>/%label% setsize <id> <scale> <#37474F>- <#BDBDBD>Change scale.'
  - '<#2F2F2F>• <#FFCA28>/%label% font <id> <name> <style> <size> <#37474F>- <#BDBDBD>Change font.'
  - '<#2F2F2F>• <#FFCA28>/%label% particle <id> <particle> <#37474F>- <#BDBDBD>Change particle.'
  - '<#2F2F2F>• <#FFCA28>/%label% rotate <id> <x|y|z> <angle> <#37474F>- <#BDBDBD>Rotate text.'
  - '<#2F2F2F>• <#FFCA28>/%label% enabled <id> <true|false> <#37474F>- <#BDBDBD>Toggle rendering.'
  - '<#2F2F2F>• <#FFCA28>/%label% inverted <id> <true|false> <#37474F>- <#BDBDBD>Toggle foreground/background pixels.'
  - '<#2F2F2F>• <#FFCA28>/%label% reload <#37474F>- <#BDBDBD>Reload every cached file.'
  - '<#37474F><st>                                                                </st>'

menu:
  renderer-name: '<!i><#FFCA28><bold>✦ %id%</bold>'
  renderer-lore:
    - '<!i><#2F2F2F>• <#B0BEC5>Text: <#FFFFFF>%text%'
    - '<!i><#2F2F2F>• <#B0BEC5>Particle: <#29B6F6>%particle%'
    - '<!i><#2F2F2F>• <#B0BEC5>Scale: <#29B6F6>%scale%'
    - '<!i><#2F2F2F>• <#B0BEC5>Inverted: <#29B6F6>%inverted%'
    - '<!i><#2F2F2F>• <#B0BEC5>Font: <#29B6F6>%font% %font_size%'
    - '<!i><#2F2F2F>• <#B0BEC5>Status: %status%'
    - ''
    - '<!i><#2F2F2F>• <#00E5FF>LEFT-CLICK <#BDBDBD>to teleport.'
    - '<!i><#2F2F2F>• <#7C4DFF>RIGHT-CLICK <#BDBDBD>to toggle.'
  status-enabled: '<!i><#00E676>Enabled'
  status-disabled: '<!i><#FF5252>Disabled'
  previous-page: '<!i><#00E5FF><bold>← Previous Page</bold>'
  previous-page-lore:
    - '<!i><#2F2F2F>• <#00E5FF>CLICK <#BDBDBD>to view the previous page.'
  next-page: '<!i><#00E5FF><bold>Next Page →</bold>'
  next-page-lore:
    - '<!i><#2F2F2F>• <#00E5FF>CLICK <#BDBDBD>to view the next page.'
  empty-name: '<!i><#FF5252><bold>✦ No Renderers</bold>'
  empty-lore:
    - ''
    - '<!i><#B0BEC5>No particle text renderers'
    - '<!i><#B0BEC5>have been created yet.'
    - ''
    - '<!i><#2F2F2F>• <#00E5FF>RUN <#BDBDBD>the command below to'
    - '<!i><#BDBDBD>  create your first renderer.'
    - ''
    - '<!i><#FFCA28>/pt create <id> <text>'
  decoration-name: '<!i><gray> '
