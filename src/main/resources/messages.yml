# Messages use Adventure MiniMessage. Hex colors, gradients, hover and click
# events are supported. PlaceholderAPI placeholders are resolved for players.

prefix: '<#8BD5CA>Particle Text</#8BD5CA><#606A7B>:</#606A7B> '
plugin-info: '%prefix%<#B8C2D4>Running <#8BD5CA>v%version% <#B8C2D4>by <click:open_url:"https://github.com/Despical"><hover:show_text:"<gray>Click to visit the Despical GitHub profile.</gray>"><#FFA726><u>Despical</u></hover></click><#B8C2D4>.'
unrecognized-arguments: '%prefix%<#FF5555>Unknown arguments. <#B8C2D4>Use <#DCE3EE>/%label% help<#B8C2D4>.'
correct-usage: '%prefix%<#FF5555>Correct usage: <#DCE3EE>%usage%'
player-only: '%prefix%<#FF5555>This command can only be used by a player.'
invalid-id: '%prefix%<#FF5555>IDs may only contain lowercase letters, numbers, underscores, and hyphens (max 32).'
renderer-exists: '%prefix%<#FF5555>A renderer named <#DCE3EE>%id% <#FF5555>already exists.'
renderer-not-found: '%prefix%<#FF5555>No renderer named <#DCE3EE>%id% <#FF5555>was found.'
renderer-created: '%prefix%<#91B78A>Created <#DCE3EE>%id% <#91B78A>with the cached defaults.'
renderer-deleted: '%prefix%<#91B78A>Deleted <#DCE3EE>%id%<#91B78A>.'
renderer-list-empty: '%prefix%<#B8C2D4>No renderers exist. Use <#DCE3EE>/%label% create <id> <text><#B8C2D4>.'
renderer-teleported: '%prefix%<#91B78A>Teleported to <#DCE3EE>%id%<#91B78A>.'
world-unavailable: '%prefix%<#FF5555>The world <#DCE3EE>%world% <#FF5555>is not currently loaded.'
renderer-moved: '%prefix%<#91B78A>Moved <#DCE3EE>%id% <#91B78A>to your location.'
renderer-shifted: '%prefix%<#91B78A>Moved <#DCE3EE>%id% <#91D7E3>%direction% <#91B78A>by <#91D7E3>%amount% <#91B78A>blocks and saved its new position.'
renderer-size: '%prefix%<#91B78A>Set <#DCE3EE>%id% <#91B78A>scale to <#91D7E3>%size%<#91B78A>.'
renderer-text: '%prefix%<#91B78A>Updated the text for <#DCE3EE>%id%<#91B78A>.'
renderer-font: '%prefix%<#91B78A>Set <#DCE3EE>%id% <#91B78A>font to <#91D7E3>%font% %style% %size%<#91B78A>.'
renderer-particle: '%prefix%<#91B78A>Set <#DCE3EE>%id% <#91B78A>particle to <#91D7E3>%particle%<#91B78A>.'
renderer-enabled: '%prefix%<#91B78A>Renderer <#DCE3EE>%id% <#91B78A>is now enabled and visible to nearby players.'
renderer-disabled: '%prefix%<#B8C2D4>Renderer <#DCE3EE>%id% <#B8C2D4>is now disabled and hidden from all players.'
renderer-inverted: '%prefix%<#91B78A>Set <#DCE3EE>%id% <#91B78A>inverted mode to <#91D7E3>%inverted%<#91B78A>.'
renderer-rotated: '%prefix%<#91B78A>Set <#DCE3EE>%id% <#91B78A>rotation on <#91D7E3>%axis% <#91B78A>to <#91D7E3>%angle%°<#91B78A>.'
renderer-already-enabled: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>is already enabled.'
renderer-already-disabled: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>is already disabled.'
renderer-location-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>is already at your location.'
renderer-size-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>already uses that scale.'
renderer-text-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>already contains that text.'
renderer-font-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>already uses that font, style, and size.'
renderer-particle-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>already uses that particle.'
renderer-inverted-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>already uses that inverted mode.'
renderer-rotation-unchanged: '%prefix%<#FF5555>Renderer <#DCE3EE>%id% <#FF5555>already has that rotation on the <#DCE3EE>%axis% <#FF5555>axis.'
invalid-number: '%prefix%<#FF5555>%value% <#B8C2D4>is not a valid number.'
invalid-size: '%prefix%<#FF5555>Scale must be between 0.01 and 10.'
text-too-long: '%prefix%<#FF5555>Renderer text may contain at most <#DCE3EE>%max% <#FF5555>characters.'
invalid-font: '%prefix%<#FF5555>Font style must be <#DCE3EE>PLAIN<#FF5555>, <#DCE3EE>BOLD<#FF5555>, <#DCE3EE>ITALIC<#FF5555>, or <#DCE3EE>BOLD_ITALIC<#FF5555>; size must be 4-128.'
invalid-axis: '%prefix%<#FF5555>Axis must be <#DCE3EE>x<#FF5555>, <#DCE3EE>y<#FF5555>, or <#DCE3EE>z<#FF5555>.'
invalid-direction: '%prefix%<#FF5555>Direction must be <#DCE3EE>forward<#FF5555>, <#DCE3EE>backward<#FF5555>, <#DCE3EE>left<#FF5555>, <#DCE3EE>right<#FF5555>, <#DCE3EE>up<#FF5555>, or <#DCE3EE>down<#FF5555>.'
invalid-move-amount: '%prefix%<#FF5555>Move amount must be between <#DCE3EE>0.01 <#FF5555>and <#DCE3EE>100 <#FF5555>blocks.'
invalid-particle: '%prefix%<#FF5555>%particle% <#B8C2D4>is not a data-free particle supported by Particle Text.'
reloaded: '%prefix%<#91B78A>Reloaded settings, messages, renderer data, PlaceholderAPI text, menu values, and the render task.'

menu:
  renderer-name: '<!i><#DCE3EE><bold>✦ %id%</bold>'
  renderer-lore:
    - '<!i><#606A7B>• <#8792A6>Text: <#DCE3EE>%text%'
    - '<!i><#606A7B>• <#8792A6>Particle: <#91D7E3>%particle%'
    - '<!i><#606A7B>• <#8792A6>Scale: <#91D7E3>%scale%'
    - '<!i><#606A7B>• <#8792A6>Inverted: <#91D7E3>%inverted%'
    - '<!i><#606A7B>• <#8792A6>Font: <#91D7E3>%font% %font_style% %font_size%'
    - '<!i><#606A7B>• <#8792A6>Status: %status%'
    - ''
    - '<!i><#606A7B>• <#8BD5CA>LEFT-CLICK <#B8C2D4>to teleport.'
    - '<!i><#606A7B>• <#8AADD3>RIGHT-CLICK <#B8C2D4>to toggle.'
  status-enabled: '<!i><#91B78A>Enabled'
  status-disabled: '<!i><#FF5555>Disabled'
  previous-page: '<!i><#8BD5CA><bold>← Previous Page</bold>'
  previous-page-lore:
    - '<!i><#606A7B>• <#8BD5CA>CLICK <#B8C2D4>to view the previous page.'
  next-page: '<!i><#8BD5CA><bold>Next Page →</bold>'
  next-page-lore:
    - '<!i><#606A7B>• <#8BD5CA>CLICK <#B8C2D4>to view the next page.'
  empty-name: '<!i><#FF5555><bold>✦ No Renderers</bold>'
  empty-lore:
    - ''
    - '<!i><#8792A6>No particle text renderers'
    - '<!i><#8792A6>have been created yet.'
    - ''
    - '<!i><#606A7B>• <#8BD5CA>RUN <#B8C2D4>the command below to'
    - '<!i><#B8C2D4>  create your first renderer.'
    - ''
    - '<!i><#DCE3EE>/pt create <id> <text>'
  decoration-name: '<!i><gray> '

# Plain variables use %name% or <name>. User text is inserted without interpreting markup.
no-permission: '%prefix%<#FF5555>You do not have permission to use this command.'
operation-failed: '%prefix%<#FF5555>The operation failed. Check the server log; existing data was kept.'
invalid-page: '%prefix%<#FF5555>Choose a page between 1 and %pages%.'
font-list: '%prefix%<#B8C2D4>Available font families: <#91D7E3>%fonts%'

chat:
  help-title: '<#DCE3EE><bold>Particle Text Commands</bold></#DCE3EE>'
  help-row: '  <#606A7B>•</#606A7B> %command% <#606A7B>·</#606A7B> <#B8C2D4>%description%</#B8C2D4>'
  command: '<#91D7E3>%command%</#91D7E3>'
  command-hover: '<#91D7E3>%command%</#91D7E3><newline><newline><#B8C2D4>%description%</#B8C2D4><newline><newline><#7ABFCC>Click to fill in this command.</#7ABFCC>'
  help-footer: '  <#8792A6>Hover for details. Click a command to fill it in.</#8792A6>'
  list-title: '<#DCE3EE><bold>Renderers</bold></#DCE3EE> <#A8B8C9>(%count%)</#A8B8C9>'
  list-row: '  <#606A7B>•</#606A7B> %name% <#606A7B>·</#606A7B> %status%'
  name: '<#8BD5CA>%id%</#8BD5CA>'
  renderer-hover: '<#DCE3EE>%id%</#DCE3EE><newline><newline><#8792A6>World: </#8792A6><#DCE3EE>%world%</#DCE3EE><newline><#8792A6>Position: </#8792A6><#DCE3EE>%x%, %y%, %z%</#DCE3EE><newline><#8792A6>Scale: </#8792A6><#DCE3EE>%scale%</#DCE3EE><newline><#8792A6>Points: </#8792A6><#DCE3EE>%points%</#DCE3EE><newline><newline><#7ABFCC>Click to manage this renderer.</#7ABFCC>'
  list-footer: '  <#8792A6>Hover a row for details. Click to manage.</#8792A6>'
  info-title: '<#DCE3EE><bold>%id%</bold></#DCE3EE>'
  info:
    - '  <#606A7B>•</#606A7B> <#8792A6>Content: </#8792A6><#DCE3EE>%text%</#DCE3EE>'
    - '  <#606A7B>•</#606A7B> <#8792A6>Status: </#8792A6>%status% <#606A7B>·</#606A7B> <#8792A6>Points: </#8792A6><#DCE3EE>%points%</#DCE3EE>'
    - '  <#606A7B>•</#606A7B> <#8792A6>Particle: </#8792A6><#91D7E3>%particle%</#91D7E3> <#606A7B>·</#606A7B> <#8792A6>Scale: </#8792A6><#DCE3EE>%scale%</#DCE3EE>'
    - '  <#606A7B>•</#606A7B> <#8792A6>Font: </#8792A6><#DCE3EE>%font% %font_style% %font_size%</#DCE3EE>'
    - '  <#606A7B>•</#606A7B> <#8792A6>Inverted: </#8792A6><#DCE3EE>%inverted%</#DCE3EE> <#606A7B>·</#606A7B> <#8792A6>Rotation: </#8792A6><#DCE3EE>%rotation%</#DCE3EE>'
    - '  <#606A7B>•</#606A7B> <#8792A6>World: </#8792A6><#DCE3EE>%world%</#DCE3EE> <#606A7B>·</#606A7B> <#DCE3EE>%x%, %y%, %z%</#DCE3EE>'
  actions: '  %actions%'
  button-teleport: '<#91D7E3>[Teleport]</#91D7E3>'
  button-edit: '<#8BD5CA>[Edit]</#8BD5CA>'
  button-enable: '<#91B78A>[Enable]</#91B78A>'
  button-disable: '<#D5B877>[Disable]</#D5B877>'
  button-delete: '<#C44B5B>[Delete]</#C44B5B>'
  hover-teleport: '<#91D7E3>Teleport to this renderer.</#91D7E3>'
  hover-edit: '<#8BD5CA>Fill in the text-edit command.</#8BD5CA>'
  hover-enable: '<#91B78A>Show this renderer to nearby players.</#91B78A>'
  hover-disable: '<#D5B877>Hide this renderer.</#D5B877>'
  hover-delete: '<#C44B5B>Fill in the deletion command for review.</#C44B5B>'
  previous: '<#91D7E3>[← Previous]</#91D7E3>'
  next: '<#91D7E3>[Next →]</#91D7E3>'
  navigation: '  %previous% <#8792A6>%page% / %pages%</#8792A6> %next%'

usage:
  create: '/%label% create <id> <text>'
  delete: '/%label% delete <id>'
  tphere: '/%label% tphere <id>'
  move: '/%label% move <id> <forward|backward|left|right|up|down> [amount]'
  text: '/%label% text <id> <text>'
  setsize: '/%label% setsize <id> <scale>'
  font: '/%label% font <id> <name> <style> <size>'
  particle: '/%label% particle <id> <particle>'
  enabled: '/%label% enabled <id> <true|false>'
  inverted: '/%label% inverted <id> <true|false>'
  rotate: '/%label% rotate <id> <x|y|z> <angle>'
  reload: '/%label% reload'
  list: '/%label% list [page]'
  menu: '/%label% menu'
  teleport: '/%label% teleport <id>'
  help: '/%label% help [page]'
  version: '/%label% version'
  info: '/%label% info <id>'
  fonts: '/%label% fonts'

description:
  create: 'Create text at your position.'
  delete: 'Delete a saved renderer.'
  tphere: 'Move a renderer to your position.'
  move: 'Move relative to your facing direction.'
  text: 'Change the renderer text.'
  setsize: 'Change the particle spacing.'
  font: 'Change text font family, style and size.'
  particle: 'Choose a data-free particle.'
  enabled: 'Show or hide a renderer.'
  inverted: 'Render background pixels for text.'
  rotate: 'Set one rotation axis in degrees.'
  reload: 'Validate and reload all configuration.'
  list: 'Browse saved renderers.'
  menu: 'Open the management inventory.'
  teleport: 'Teleport to a renderer.'
  help: 'Browse commands you can use.'
  version: 'Show the installed version.'
  info: 'Inspect and manage a renderer.'
  fonts: 'List font families available to Java.'

reload-failed: '%prefix%<#FF5555>Reload rejected: %reason%. The active configuration was kept.'
teleport-failed: '%prefix%<#FF5555>Teleporting to %id% was cancelled by the server.'
command-description: 'Manage particle text'
